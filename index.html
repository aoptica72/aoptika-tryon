
<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>А-Оптика — примерочная</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f4fa;color:#202a43;font-family:Arial,sans-serif}
main{max-width:650px;margin:auto;padding:16px}
h1{font-size:25px}
.panel{background:white;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 3px 15px #0001}
button,.upload{display:inline-block;background:#293d83;color:white;border:0;border-radius:10px;padding:12px;margin:4px;cursor:pointer;font-size:15px}
input[type=file]{display:none}
#stage{position:relative;background:#e7eaf2;min-height:280px;border-radius:12px;overflow:hidden;touch-action:none}
#photo{display:none;width:100%;height:auto}
#glasses{position:absolute;left:50%;top:43%;width:48%;transform:translate(-50%,-50%);display:none;touch-action:none;cursor:move}
#glasses svg{width:100%;display:block}
#hint{padding:90px 15px;text-align:center;color:#69748b}
.frames{display:flex;flex-wrap:wrap;gap:6px}
.frames button{flex:1;min-width:90px}
.active{background:#159477}
.controls{display:grid;gap:12px}
input[type=range]{width:100%}
#status{color:#52627d;font-size:14px}
</style>
</head>
<body>
<main>
<h1>👓 А-Оптика | Примерочная</h1>
<div class="panel">
<label class="upload" for="upload">📷 Загрузить фото</label>
<input id="upload" type="file" accept="image/*">
<p id="status">Выберите фотографию лица</p>
<div id="stage">
<div id="hint">Здесь появится ваша фотография</div>
<img id="photo" alt="Ваше фото">
<div id="glasses"></div>
</div>
</div>
<div class="panel">
<h3>Выберите оправу</h3>
<div class="frames">
<button data-frame="0" class="active">Классика</button>
<button data-frame="1">Круглая</button>
<button data-frame="2">Авиатор</button>
</div>
<p>Перемещайте очки пальцем или мышью.</p>
<div class="controls">
<label>Размер очков
<input id="size" type="range" min="20" max="90" value="48">
</label>
<label>Положение по высоте
<input id="height" type="range" min="10" max="85" value="43">
</label>
</div>
<button id="save">Сохранить примерку</button>
</div>
<p style="font-size:12px;color:#68748a">
Демонстрационная версия. Фото обрабатывается на вашем устройстве и не отправляется на сервер.
</p>
</main>
<script>
const photo=document.getElementById('photo');
const glasses=document.getElementById('glasses');
const stage=document.getElementById('stage');
const status=document.getElementById('status');
const hint=document.getElementById('hint');
let current=0;
let imageURL=null;
let posX=50,posY=43;
const shapes=[
'<rect x="18" y="23" width="83" height="53" rx="13"/><rect x="139" y="23" width="83" height="53" rx="13"/>',
'<ellipse cx="60" cy="50" rx="42" ry="35"/><ellipse cx="180" cy="50" rx="42" ry="35"/>',
'<path d="M18 28 Q60 10 102 28 L95 65 Q60 108 25 65Z"/><path d="M138 28 Q180 10 222 28 L215 65 Q180 108 145 65Z"/>'
];
function svg(){
return '<svg viewBox="0 0 240 110" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#292b37" stroke-width="7" stroke-linejoin="round">'+shapes[current]+'<path d="M101 37 Q120 23 139 37 M18 35 L0 25 M222 35 L240 25"/></g></svg>';
}
function update(){
glasses.innerHTML=svg();
glasses.style.width=document.getElementById('size').value+'%';
glasses.style.left=posX+'%';
glasses.style.top=posY+'%';
}
document.getElementById('upload').addEventListener('change',e=>{
const file=e.target.files[0];
if(!file)return;
if(!file.type.startsWith('image/')){
status.textContent='Выберите файл изображения';
return;
}
const reader=new FileReader();
status.textContent='Загрузка фотографии...';
reader.onload=()=>{
const test=new Image();
test.onload=()=>{
if(imageURL)URL.revokeObjectURL(imageURL);
imageURL=URL.createObjectURL(file);
photo.onload=()=>{
photo.style.display='block';
hint.style.display='none';
glasses.style.display='block';
status.textContent='Фото загружено. Выберите оправу.';
update();
};
photo.onerror=()=>status.textContent='Не удалось показать фото';
photo.src=imageURL;
};
test.onerror=()=>status.textContent='Формат фото не поддерживается. Попробуйте JPG.';
test.src=reader.result;
};
reader.onerror=()=>status.textContent='Ошибка чтения файла';
reader.readAsDataURL(file);
});
document.querySelectorAll('[data-frame]').forEach(b=>{
b.onclick=()=>{
current=Number(b.dataset.frame);
document.querySelectorAll('[data-frame]').forEach(x=>x.classList.remove('active'));
b.classList.add('active');
update();
};
});
document.getElementById('size').oninput=update;
document.getElementById('height').oninput=e=>{
posY=Number(e.target.value);
update();
};
let dragging=false;
glasses.addEventListener('pointerdown',e=>{
dragging=true;
glasses.setPointerCapture(e.pointerId);
e.preventDefault();
});
glasses.addEventListener('pointermove',e=>{
if(!dragging)return;
const r=stage.getBoundingClientRect();
posX=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));
posY=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));
document.getElementById('height').value=posY;
update();
});
glasses.addEventListener('pointerup',()=>dragging=false);
glasses.addEventListener('pointercancel',()=>dragging=false);
document.getElementById('save').onclick=async()=>{
if(!photo.complete||!photo.naturalWidth){
alert('Сначала загрузите фото');return;
}
const canvas=document.createElement('canvas');
canvas.width=photo.naturalWidth;
canvas.height=photo.naturalHeight;
const ctx=canvas.getContext('2d');
ctx.drawImage(photo,0,0,canvas.width,canvas.height);
const s=new Image();
s.onload=()=>{
const r=stage.getBoundingClientRect();
const gr=glasses.getBoundingClientRect();
const kx=canvas.width/r.width,ky=canvas.height/r.height;
ctx.drawImage(s,(gr.left-r.left)*kx,(gr.top-r.top)*ky,gr.width*kx,gr.height*ky);
const a=document.createElement('a');
a.download='a-optika-primerka.png';
a.href=canvas.toDataURL('image/png');
a.click();
};
s.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg());
};
update();
window.Telegram?.WebApp?.ready?.();
</script>
</body>
</html>
