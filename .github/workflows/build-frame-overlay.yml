name: Build approved DACCHi front overlay
on:
  push:
    branches: [feat/telegram-miniapp-bot-20261112]
    paths:
      - 'telegram_bot/**'
      - '.github/workflows/build-frame-overlay.yml'
      - 'dacchi-34355.png'
permissions:
  contents: write
jobs:
  build-overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'Pillow>=10,<13'
      - run: python -m telegram_bot.export_frame
      - uses: actions/upload-artifact@v4
        with:
          name: dacchi-34355-source-and-overlay
          path: |
            dacchi-34355.png
            dacchi-34355-front.png
            qa-mask-contours.jpg
            qa-overlay-preview.jpg
      - name: Commit generated transparent PNG without touching original
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dacchi-34355-front.png
          if ! git diff --cached --quiet; then
            git commit -m 'Build front-only transparent DACCHi 34355 PNG'
            git push
          fi
