name: Telegram try-on tests
on:
  push:
    paths: ['telegram_bot/**', 'telegram.html', 'telegram.js', '.github/workflows/telegram-bot-ci.yml']
  pull_request:
    paths: ['telegram_bot/**', 'telegram.html', 'telegram.js', '.github/workflows/telegram-bot-ci.yml']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow pytest 'aiogram>=3.13,<4' 'python-dotenv>=1,<2'
      - run: python -m pytest -q telegram_bot/tests
      - run: python -m compileall -q telegram_bot
      - run: node --check telegram.js
      - run: python -c 'from telegram_bot.app import router; assert router'
